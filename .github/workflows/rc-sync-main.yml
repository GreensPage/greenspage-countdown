name: Sync verified v1.1.1 RC to main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for complete staging payload
        id: ready
        shell: bash
        run: |
          if [[ -f .sync/rc.patch && -f .sync/SHA256SUMS ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply and verify tested release candidate
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .sync/rc.patch
          git apply .sync/rc.patch
          sha256sum -c .sync/SHA256SUMS
          test "$(sha256sum assets/js/editor.js | awk '{print $1}')" = "bf7eedc22e6c15cd8567a4d5e66ebda9c472b869f9665bb6f8f34bdf4bb5eea8"
          grep -q '^ \* Version:[[:space:]]*1\.1\.1$' greenspage-countdown.php
          grep -q '^Stable tag: 1\.1\.1$' readme.txt
          git diff --check

      - name: Commit verified tree and clean staging
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .sync
          rm -f .github/workflows/rc-sync-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync tested Greenspage Countdown v1.1.1 RC"
          git push origin HEAD:main
          git push origin --delete rc-sync || true
