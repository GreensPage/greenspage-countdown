name: Assemble temporary license

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact LICENSE and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          cat .license-parts/00 .license-parts/01 .license-parts/02 .license-parts/03 .license-parts/04 > /tmp/license.b64
          base64 --decode /tmp/license.b64 > LICENSE
          rm -rf .license-parts
          rm -f .github/workflows/assemble-license.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Assemble exact GPL-2.0 license" || exit 0
          git push origin HEAD:main
